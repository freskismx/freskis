<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego promocional</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111,#1e1e2f);color:#fff}
    .card{max-width:560px;padding:28px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
    h1{margin-top:0}
    p{line-height:1.55;color:#e5e7eb}
    code{background:rgba(255,255,255,.1);padding:3px 8px;border-radius:8px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Área de videojuego promocional</h1>
    <p>Aquí se mostrará tu juego HTML exportado desde Scratch o TurboWarp.</p>
    <p>Coloca el archivo en <code>game/index.html</code> y configúralo desde el panel de administración.</p>
  </div>
</body>
</html>
